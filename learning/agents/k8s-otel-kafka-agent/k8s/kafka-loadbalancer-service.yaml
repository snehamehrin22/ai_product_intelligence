apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  labels:
    app: kafka
spec:
  type: LoadBalancer
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: kafka
  selector:
    app: kafka
---
# Note: For production, you should use:
# 1. Azure Private Link for secure connectivity
# 2. Or VNet peering between AKS and Databricks
# 3. LoadBalancer is simplest for learning/POC

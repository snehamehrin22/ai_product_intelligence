apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  otel-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 100

    exporters:
      # Debug exporter for debugging (replaces deprecated logging exporter)
      debug:
        verbosity: detailed

      # Kafka exporter (will be configured in US-6)
      # kafka:
      #   brokers:
      #     - <eventhub-namespace>.servicebus.windows.net:9093
      #   protocol_version: 2.0.0
      #   topic: agent-traces
      #   auth:
      #     sasl:
      #       mechanism: PLAIN
      #       username: "$ConnectionString"
      #       password: "${EVENTHUB_CONNECTION_STRING}"

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]  # Add kafka later

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  otel-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 100

    exporters:
      # Debug exporter for debugging (replaces deprecated logging)
      debug:
        verbosity: detailed

      # Kafka exporter (self-hosted Kafka in AKS)
      kafka:
        brokers:
          - kafka-0.kafka:9092
        protocol_version: 2.0.0
        topic: agent-traces
        metadata:
          full: false
        producer:
          max_message_bytes: 1000000

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, kafka]

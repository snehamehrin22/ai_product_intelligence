apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: copilot-otel
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        # contrib image required for oauth2clientauthextension
        image: otel/opentelemetry-collector-contrib:0.111.0
        args:
          - "--config=/etc/otel-config.yaml"
        env:
        - name: DATABRICKS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: zerobus-creds
              key: client-id
        - name: DATABRICKS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: zerobus-creds
              key: client-secret
        # Fill these in for your own workspace before applying.
        # Host is the workspace URL without scheme; ZEROBUS_HOST is the regional
        # ZeroBus endpoint, also without scheme or port.
        - name: DATABRICKS_WORKSPACE_HOST
          value: "adb-<WORKSPACE_ID>.<SHARD>.azuredatabricks.net"
        - name: DATABRICKS_WORKSPACE_ID
          value: "<WORKSPACE_ID>"
        - name: ZEROBUS_HOST
          value: "<WORKSPACE_ID>.zerobus.<REGION>.azuredatabricks.net"
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: health
          containerPort: 13133
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/otel-config.yaml
          subPath: otel-config.yaml
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
